{% extends "intake/wizard_base.html" %}

{% block chat_messages %}
  {% for row in member_rows %}
    <div class="bubble coach">{{ row.label }} — takes prescriptions?</div>
    <div class="choice-btn-group">
      {% for choice in row.field %}
        <label>{{ choice.tag }}<span>{{ choice.choice_label }}</span></label>
      {% endfor %}
    </div>
  {% endfor %}
{% endblock %}

{% endblock %}
