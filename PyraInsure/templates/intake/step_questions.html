{% extends "intake/wizard_base.html" %}

{% block step_body %}
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="card tint-orange card-pad-sm" style="margin-bottom: 16px;">
        <small style="color: var(--bad);">{{ form.non_field_errors }}</small>
      </div>
    {% endif %}
    {% for field in form %}
      <label class="field" {% if field.field.widget.input_type == 'radio' %}style="display: block;"{% endif %}>
        {{ field.label }}
        {{ field }}
        {% if field.help_text %}
          <small class="muted" style="display: block; margin-top: 4px;">{{ field.help_text }}</small>
        {% endif %}
        {% if field.errors %}
          <small style="color: var(--bad); display: block; margin-top: 4px;">{{ field.errors.0 }}</small>
        {% endif %}
      </label>
    {% endfor %}
    <div class="row between" style="padding-top: 24px;">
      {% if previous_step %}
        <button type="submit" name="nav" value="previous" class="btn ghost">← Previous</button>
      {% else %}
        <div></div>
      {% endif %}
      <button type="submit" name="nav" value="next" class="btn brand">Next</button>
    </div>
  </form>
{% endblock %}
