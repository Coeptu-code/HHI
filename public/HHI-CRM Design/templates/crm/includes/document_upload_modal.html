<div
  class="modal fade"
  id="documentUploadModal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="documentUploadModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="documentUploadModalLabel">Upload Document</h5>
        <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body scanner-modal-body">
        <div class="row">
          <div class="col-lg-7">
            <div class="scanner-preview-card">
              <video id="scannerVideo" autoplay playsinline muted></video>
              <canvas id="scannerCanvas" class="d-none"></canvas>

              <div class="scanner-fallback d-none" id="scannerFallback">
                <p class="text-muted mb-2">Camera preview unavailable. Use the file upload fallback.</p>
                <input
                  type="file"
                  id="scannerFileInput"
                  accept="image/*"
                  capture="environment"
                  multiple
                  class="form-control"
                >
              </div>
            </div>

            <div class="scanner-controls mt-3">
              <button type="button" class="btn btn-info btn-round" id="startCameraBtn">Start Camera</button>
              <button type="button" class="btn btn-primary btn-round" id="capturePageBtn">Snap Page</button>
              <button type="button" class="btn btn-warning btn-round" id="retakeCurrentBtn">Retake Current</button>
              <button type="button" class="btn btn-secondary btn-round" id="useFallbackBtn">Use File Upload</button>
            </div>
          </div>

          <div class="col-lg-5">
            <form id="clientAttachmentMetaForm" onsubmit="return false;">
              {% csrf_token %}

              <div class="form-group">
                <label for="{{ attachment_form.document_type.id_for_label }}">Document Type</label>
                {{ attachment_form.document_type }}
              </div>
              <div class="form-group">
                <label for="{{ attachment_form.display_name.id_for_label }}">Display Name</label>
                {{ attachment_form.display_name }}
              </div>
            </form>

            <h5 class="mt-4">Pages</h5>
            <div id="thumbnailStrip" class="thumbnail-strip"></div>

            <div class="mt-3">
              <small class="text-muted">Reorder pages using the Move Left / Move Right buttons.</small>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div class="mr-auto" id="uploadStatusText"></div>
        <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-success btn-round" id="attachToClientBtn">Attach to Client</button>
      </div>
    </div>
  </div>
</div>
